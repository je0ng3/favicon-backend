name: Deploy to DockerHub & EC2

on:
  push:
    branches: [ main, develop ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
        with:
          cache-read-only: false

      - name: Grant Execute Permission For Gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: | 
          set -e
          ./gradlew clean build -Dspring.profiles.active=local

      # latest 는 배포(compose)가 참조하는 태그, 커밋 SHA 태그는 이력 추적·롤백용
      - name: Build Docker image
        run: |
          docker build \
          -f Dockerfile \
          -t ${{ vars.DOCKERHUB_USERNAME}}/erica-favicon:latest \
          -t ${{ vars.DOCKERHUB_USERNAME}}/erica-favicon:${{ github.sha }} .

      - name: DockerHub login
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKERHUB_USERNAME}}
          password: ${{ vars.DOCKERHUB_PASSWORD}}

      - name: Push Docker image
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME}}/erica-favicon:latest
          docker push ${{ vars.DOCKERHUB_USERNAME}}/erica-favicon:${{ github.sha }}

      # EC2 인스턴스 운영 여부에 따라 repository variable EC2_DEPLOY_ENABLED('true'/'false')로 켜고 끈다
      - name: Deploy to EC2
        if: ${{ vars.EC2_DEPLOY_ENABLED == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ vars.DOCKERHUB_USERNAME }}/erica-favicon:latest
            docker rm -f back 2>/dev/null || true
            docker compose -f docker-compose.yml --env-file .env up --build -d