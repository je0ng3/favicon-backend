name: Deploy to DockerHub & EC2

on:
  push:
    branches: [ main, develop ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
        with:
          cache-read-only: false

      - name: Grant Execute Permission For Gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: | 
          set -e
          ./gradlew clean build -Dspring.profiles.active=local

      # main 은 배포(compose)가 참조하는 latest, develop 은 develop 태그로 분리하고
      # 커밋 SHA 태그는 공통으로 붙여 이력 추적·롤백용으로 쓴다
      - name: Set branch image tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "BRANCH_TAG=latest" >> $GITHUB_ENV
          else
            echo "BRANCH_TAG=develop" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: DockerHub login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME}}
          password: ${{ vars.DOCKERHUB_PASSWORD}}

      # jar COPY 이전 레이어(베이스 이미지, yum install)를 GitHub Actions 캐시에 보관해
      # 매 빌드마다 다시 받지 않도록 한다
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/erica-favicon:${{ env.BRANCH_TAG }}
            ${{ vars.DOCKERHUB_USERNAME }}/erica-favicon:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 운영 배포는 main 빌드만 대상으로 하고, EC2 인스턴스 운영 여부는
      # repository variable EC2_DEPLOY_ENABLED('true'/'false')로 켜고 끈다
      - name: Deploy to EC2
        if: ${{ github.ref_name == 'main' && vars.EC2_DEPLOY_ENABLED == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ vars.DOCKERHUB_USERNAME }}/erica-favicon:latest
            docker rm -f back 2>/dev/null || true
            docker compose -f docker-compose.yml --env-file .env up --build -d