name: PR Build TEST

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
        with:
          cache-read-only: false

      - name: Grant Execute Permission For Gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          set -e
          ./gradlew clean build -Dspring.profiles.active=local

      # 테스트가 실패해도 어디까지 덮였는지는 보이는 게 낫다
      - name: Coverage summary
        if: always()
        run: |
          csv=build/reports/jacoco/test/jacocoTestReport.csv
          if [ ! -f "$csv" ]; then
            echo "커버리지 리포트 없음: $csv" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          awk -F, 'NR>1 {bm+=$6; bc+=$7; lm+=$8; lc+=$9; mm+=$12; mc+=$13} END {
            printf "| 지표 | 커버리지 |\n|---|---|\n"
            if (lc+lm) printf "| Line | %.1f%% (%d/%d) |\n", 100*lc/(lc+lm), lc, lc+lm
            if (bc+bm) printf "| Branch | %.1f%% (%d/%d) |\n", 100*bc/(bc+bm), bc, bc+bm
            if (mc+mm) printf "| Method | %.1f%% (%d/%d) |\n", 100*mc/(mc+mm), mc, mc+mm
          }' "$csv" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html
